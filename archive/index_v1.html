<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KMU 타인의 폰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:radial-gradient(circle at 30% 20%,#1e293b,#020617 70%);display:flex;align-items:center;justify-content:center;min-height:100dvh;color:#111;overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit}
input{font-family:inherit}
.phone{position:relative;height:min(860px,calc(100dvh - 32px));aspect-ratio:390/860;background:#000;border-radius:52px;border:11px solid #0a0a0a;box-shadow:0 0 0 2px #333,0 30px 80px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:520px){body{background:#000}.phone{height:100dvh;width:100vw;aspect-ratio:auto;border-radius:0;border:0;box-shadow:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}}
.hud{height:42px;flex:none;background:#0b1020;color:#e2e8f0;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;font-weight:500}
.hud .sp{flex:1}
.hud button{background:#1e293b;padding:6px 10px;border-radius:99px;font-size:12px;color:#e2e8f0;white-space:nowrap}
.hud button.pri{background:#6366f1;color:#fff}
.hud .x{background:none;font-size:18px;padding:4px 6px}
#screen{flex:1;position:relative;overflow:hidden;background:#fff}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.sb{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:700}
.sb.l{color:#fff}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.homebar{height:22px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.homebar i{width:130px;height:5px;border-radius:9px;background:#111;opacity:.85}
.homebar.l i{background:#fff}
/* launcher */
.launch{background:linear-gradient(180deg,#0b1020,#111827);color:#fff}
.launch h1{font-size:28px;font-weight:900;letter-spacing:-.5px}
.launch .sub{color:#94a3b8;font-size:13px;margin-top:4px}
.poster{display:block;width:100%;text-align:left;border-radius:22px;padding:20px;margin-top:16px;color:#fff;position:relative;overflow:hidden;min-height:170px}
.poster .em{position:absolute;right:-10px;bottom:-18px;font-size:110px;opacity:.25}
.poster h2{font-size:22px;font-weight:900;margin:8px 0 6px}
.poster p{font-size:13px;opacity:.9;line-height:1.5;max-width:85%}
.chip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.2);margin-right:4px;font-weight:700}
.play{margin-top:12px;display:inline-block;background:#fff;color:#111;padding:7px 16px;border-radius:99px;font-weight:700;font-size:13px}
/* home */
.wall1{background:linear-gradient(160deg,#7c3aed 0%,#db2777 55%,#f59e0b 100%)}
.wall2{background:linear-gradient(160deg,#0f766e 0%,#1d4ed8 60%,#111827 100%)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:26px 18px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.4);position:relative}
.ico{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.25);position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;text-shadow:none}
.lockico{position:absolute;inset:0;background:rgba(0,0,0,.55);border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px}
.widget{margin:4px 18px 0;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border-radius:22px;padding:14px 16px;color:#fff}
.widget b{font-size:15px}
.widget p{font-size:12.5px;opacity:.95;margin-top:4px;line-height:1.5}
/* lock */
.lock{background:linear-gradient(180deg,#1e1b4b,#4c1d95 60%,#831843);color:#fff;text-align:center}
.lock .t{font-size:72px;font-weight:300;letter-spacing:-2px;margin-top:6px}
.lock .d{font-size:16px;opacity:.85}
.noti{margin:10px 14px 0;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:16px;padding:10px 12px;text-align:left;font-size:12.5px}
.noti b{display:block;font-size:12px;opacity:.8;margin-bottom:2px}
.dots{display:flex;gap:14px;justify-content:center;margin:16px 0 10px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots i.f{background:#fff}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px 22px;justify-content:center}
.pad button{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);font-size:26px;color:#fff;font-weight:400}
.pad button.n{background:none;font-size:14px}
.pad button:active{background:rgba(255,255,255,.4)}
/* app chrome */
.hdr{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 10px;border-bottom:1px solid #eee;background:#fff}
.hdr h3{font-size:17px;font-weight:700;flex:1;text-align:center;margin-right:40px}
.back{color:#2563eb;font-size:15px;width:44px;text-align:left}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #f1f1f1;cursor:pointer;width:100%;text-align:left;background:#fff}
.row:active{background:#f5f5f5}
.av{width:46px;height:46px;border-radius:17px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.row .m{flex:1;min-width:0}
.row .m b{font-size:15px;display:block}
.row .m span{font-size:13px;color:#6b7280;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:11px;color:#9ca3af;text-align:right}
.unread{background:#ef4444;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;display:inline-block;margin-top:4px}
.chat{background:#b2c7d9;padding:12px}
.ds{text-align:center;margin:10px 0;font-size:11.5px;color:#fff;background:rgba(0,0,0,.15);border-radius:99px;padding:3px 12px;display:table;margin-left:auto;margin-right:auto}
.msg{display:flex;margin:6px 0;gap:6px;align-items:flex-end}
.msg .bb{max-width:72%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.45;background:#fff;word-break:keep-all}
.msg.me{justify-content:flex-end}
.msg.me .bb{background:#fee500}
.msg .nm{font-size:11.5px;color:#334155;margin:0 0 2px 2px}
.msg .tm{font-size:10px;color:#475569}
.hl{background:linear-gradient(transparent 55%,rgba(250,204,21,.6) 55%)}
.mailv{padding:18px}
.mailv h2{font-size:18px;line-height:1.4}
.mailv .from{font-size:13px;color:#6b7280;margin:8px 0 14px;padding-bottom:12px;border-bottom:1px solid #eee}
.mailv .tx{font-size:14.5px;line-height:1.75;white-space:pre-line}
.box{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin:12px 0;background:#f9fafb;font-size:13.5px;line-height:1.7}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer}
.phbig{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:110px}
.cap{padding:16px;font-size:14.5px;line-height:1.6}
.ss{background:#fff;margin:18px;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:13px}
.ss h4{font-size:14px;margin-bottom:10px;color:#1e3a8a}
.ss .li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e5e7eb}
.ok{color:#16a34a;font-weight:700}.no{color:#dc2626;font-weight:700}.wait{color:#d97706;font-weight:700}
.calday{padding:10px 16px 4px;font-size:12px;color:#6b7280;font-weight:700;background:#fafafa}
.ev{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #f3f4f6;width:100%;text-align:left;background:#fff}
.ev i{width:4px;align-self:stretch;border-radius:2px}
.ev b{font-size:14.5px;font-weight:500}
.ev span{font-size:12px;color:#9ca3af;display:block}
.note{background:#fffbea;min-height:100%;padding:18px;font-size:15px;line-height:1.9;white-space:pre-line}
.note h2{font-size:20px;margin-bottom:8px}
.card{margin:14px;border-radius:18px;padding:18px;color:#fff}
.tx2{font-size:13px;line-height:1.7}
/* overlay */
#overlay{position:absolute;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.45)}
#overlay.on{display:flex}
#overlay.c{align-items:center;justify-content:center}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px 26px;max-height:88%;overflow-y:auto;animation:up .25s ease}
.dlg{width:88%;background:#fff;border-radius:22px;padding:22px 18px;max-height:86%;overflow-y:auto;animation:pop .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.sheet h3,.dlg h3{font-size:18px;margin-bottom:8px}
.sheet p,.dlg p{font-size:14px;line-height:1.7;color:#374151}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:#4f46e5;color:#fff;font-weight:700;font-size:15px;margin-top:10px;text-align:center}
.btn.g{background:#f1f5f9;color:#1f2937}
.btn.o{background:#fff;border:1.5px solid #e5e7eb;color:#111;text-align:left;font-weight:500}
.btn.o:active{background:#eef2ff}
.ox{display:flex;gap:10px;margin-top:14px}
.ox button{flex:1;height:84px;border-radius:18px;font-size:40px;font-weight:900}
.ox .o1{background:#dbeafe;color:#1d4ed8}.ox .x1{background:#fee2e2;color:#b91c1c}
.codein{width:100%;font-size:34px;letter-spacing:14px;text-align:center;padding:12px;border:2px solid #e5e7eb;border-radius:16px;margin-top:12px;outline:none}
.codein:focus{border-color:#6366f1}
.banner{position:absolute;top:44px;left:8px;right:8px;z-index:60;background:rgba(245,245,245,.97);border-radius:18px;padding:11px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);cursor:pointer;animation:drop .35s ease;font-size:13px}
.banner b{font-size:12px;color:#6b7280;display:block;margin-bottom:2px}
@keyframes drop{from{transform:translateY(-120%)}}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:80;background:rgba(17,24,39,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.sticky{background:#fde68a;transform:rotate(-2deg);padding:16px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.2);font-size:15px;line-height:1.6;margin:14px 6px;font-weight:500}
.idcard{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:14px 16px;margin:14px 6px;display:flex;gap:12px;align-items:center}
.idcard .pf{width:56px;height:68px;border-radius:8px;background:#bfdbfe;display:flex;align-items:center;justify-content:center;font-size:34px}
.idcard div{font-size:12.5px;line-height:1.6}
.intro{background:#0b1020;color:#e5e7eb;padding:22px 20px}
.intro h2{font-size:24px;font-weight:900;color:#fff;margin:10px 0}
.intro p{font-size:14.5px;line-height:1.85}
.score{display:flex;gap:8px;margin:14px 0}
.score div{flex:1;background:#f1f5f9;border-radius:14px;padding:10px;text-align:center;font-size:12px;color:#64748b}
.score b{display:block;font-size:22px;color:#111}
.learn{background:#eef2ff;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:13.5px;line-height:1.65}
.learn b{color:#3730a3}
.pieces{display:flex;gap:8px;justify-content:center;margin:14px 0}
.pieces span{width:52px;height:52px;border-radius:14px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#94a3b8;border:2px dashed #cbd5e1}
.pieces span.g{background:#fef3c7;color:#92400e;border:2px solid #f59e0b}
.stl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.stl .n{width:28px;height:28px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.stl .n.d{background:#22c55e;color:#fff}
table.adm{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
table.adm td,table.adm th{border:1px solid #e5e7eb;padding:7px;text-align:left}
table.adm th{background:#f8fafc}
.fake{font-size:10.5px;color:#9ca3af;text-align:center;padding:10px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="hud" id="hud"></div>
  <div id="screen"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
</div>

<script>
/* =========================================================
   KMU 타인의 폰 — 프로토타입
   ※ 등장인물·대화·앱은 모두 가상입니다.
   ※ 사건2의 장소·코드는 아래 STATIONS 에서 바꾸면 됩니다.
   ========================================================= */

/* ---------- 사건2 현장 설정 (운영자가 바꾸는 곳) ---------- */
const STATIONS = [
  {place:'동산도서관', code:'2741', piece:'함',
   quiz:{q:'국가장학금은 한 번 신청하면 졸업할 때까지 매 학기 자동으로 신청된다.', a:false,
         exp:'국가장학금은 <b>매 학기 직접 신청</b>해야 해요. 신청 기간을 꼭 챙기세요! 📅'}},
  {place:'아담스채플', code:'1954', piece:'께',
   quiz:{q:'"장학금 지급 보류" 문자에 있는 링크는 일단 눌러서 확인해보는 게 안전하다.', a:false,
         exp:'장학금을 사칭한 <b>스미싱</b>일 수 있어요. 링크는 누르지 말고, 한국장학재단 공식 앱이나 학교 장학 부서로 직접 확인하세요 🚫'}},
  {place:'행소박물관', code:'3388', piece:'빛',
   quiz:{q:'국가장학금 심사를 받으려면 부모님(가구원)의 정보제공 동의도 필요하다.', a:true,
         exp:'맞아요! 학생 본인 신청만으로는 부족하고 <b>가구원 정보제공 동의</b>까지 끝나야 소득 심사가 시작돼요 👨‍👩‍👧'}},
  {place:'계명한학촌', code:'0519', piece:'나',
   quiz:{q:'장학금 관련해서 궁금한 게 있으면 학교 장학 담당 부서에 직접 문의할 수 있다.', a:true,
         exp:'그럼요! 혼자 고민하지 말고 <b>장학복지팀</b>에 편하게 물어보세요 😊'}}
];
const FINAL_WORD = '함께빛나';

/* ---------- 공통 유틸 ---------- */
const $ = s => document.querySelector(s);
const scr = () => $('#screen');
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
function now(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function sb(light){return `<div class="sb ${light?'l':''}"><span>${now()}</span><span>📶 🔋</span></div>`}
function homebar(light){return `<div class="homebar ${light?'l':''}" data-act="home"><i></i></div>`}
function hdr(title,back='back'){return `<div class="hdr"><button class="back" data-act="${back}">‹ 뒤로</button><h3>${title}</h3></div>`}
function openSheet(html,center){const o=$('#overlay');o.className='on'+(center?' c':'');o.innerHTML=center?`<div class="dlg">${html}</div>`:`<div class="sheet">${html}</div>`}
function closeSheet(){const o=$('#overlay');o.className='';o.innerHTML='';delete o.dataset.lock}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&!$('#overlay').dataset.lock)closeSheet()});

let MODE='menu'; // menu | c1 | c2 | admin
const A = {}; // actions

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=A[el.dataset.act]; if(fn) fn(el.dataset.arg, el);
});

function render(){
  if(MODE==='menu') renderMenu();
  else if(MODE==='c1') R1();
  else if(MODE==='c2') R2();
  else if(MODE==='admin') renderAdmin();
}

/* ================= 런처 ================= */
function renderMenu(){
  $('#hud').innerHTML=`<span>🎮 KMU 타인의 폰</span><span class="sp"></span><span style="opacity:.6">프로토타입</span>`;
  const c2=store.get('kmu_c2');
  scr().innerHTML=`<div class="scr launch">${sb(true)}<div class="body" style="padding:10px 18px 24px">
    <h1>타인의 폰 📱</h1>
    <div class="sub">계명대 버전 · 남의 폰 속 단서로 사건을 풀어요</div>
    <button class="poster" style="background:linear-gradient(135deg,#4f46e5,#9333ea)" data-act="start1">
      <span class="chip">🕵️ 추리</span><span class="chip">🎓 장학</span><span class="chip">⏱ 10분</span>
      <h2>사라진 장학금</h2>
      <p>친구 하늘이는 이번 학기 국가장학금을 받지 못했어요. 하늘이가 맡긴 폰을 뒤져 그 이유를 찾아주세요.</p>
      <span class="play">▶ 플레이</span><span class="em">💸</span>
    </button>
    <button class="poster" style="background:linear-gradient(135deg,#0f766e,#2563eb)" data-act="start2">
      <span class="chip">🗺️ 캠퍼스</span><span class="chip">🔓 방탈출</span><span class="chip">⏱ 40분</span>
      <h2>축제 전날, 사라진 도윤</h2>
      <p>축제기획단 도윤이가 폰만 남기고 사라졌어요. 캠퍼스 곳곳의 현장 코드를 찾아 폰을 하나씩 열어보세요!</p>
      <span class="play">${c2&&c2.step>0&&!c2.done?'▶ 이어하기 ('+c2.step+'/4)':'▶ 플레이'}</span><span class="em">🎪</span>
    </button>
    <button style="margin-top:22px;color:#94a3b8;font-size:12.5px;text-decoration:underline" data-act="admin">⚙️ 운영자 페이지 (현장 코드·초기화)</button>
    <div class="fake" style="color:#64748b">※ 등장인물과 대화는 모두 가상입니다.</div>
  </div></div>`;
}
A.start1=()=>{G1=newG1();MODE='c1';render()};
A.start2=()=>{const s=store.get('kmu_c2');G2=(s&&!s.done)?s:newG2();MODE='c2';render()};
A.menu=()=>{closeSheet();MODE='menu';history.replaceState(null,'',location.pathname+location.search);render()};
A.admin=()=>{MODE='admin';render()};

/* ================= 사건1: 사라진 장학금 ================= */
const CL = {
  mom:'엄마와의 대화 — 아빠 인증서 만료',
  jisu:'지수와의 대화 — "동의 안 하면 심사 자체가 안 돼"',

}

  G2.step=+i+1;save2();
  const nextApp=APPS2_ICONS.find(a=>a.lock===G2.step);

   <button class="btn" style="background:#0d9488" data-act="afterOk" data-arg="${nextApp.id}">${nextApp.n} 열어보기</button>`,true);
  $('#overlay').dataset.lock=1;
};

/* ================= 해시(QR) 처리 ================= */
function handleHash(){
  const h=(location.hash||'').slice(1);
  const m=h.match(/^k(\d{4})$/);
  if(m){
    const s=store.get('kmu_c2');G2=(s&&!s.done)?s:newG2();
    if(G2.stage!=='phone'){G2.stage='phone';G2.start=G2.start||Date.now();save2()}
    MODE='c2';render();setTimeout(()=>A.submitCode(m[1]),300);return true;
  }
  if(h==='case1'){A.start1();return true}
  if(h==='case2'){A.start2();return true}
  if(h==='admin'){MODE='admin';render();return true}
  return false;
}
window.addEventListener('hashchange',handleHash);
if(!handleHash())render();
setInterval(()=>{document.querySelectorAll('.sb span:first-child').forEach(e=>e.textContent=now())},30000);
