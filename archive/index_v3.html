<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>KMU 타인의 폰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--blue:#007AFF;--red:#FF3B30;--green:#34C759;--gray:#8E8E93;--sep:rgba(60,60,67,.18);--bg2:#F2F2F7;
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--f);-webkit-font-smoothing:antialiased;background:#08080a radial-gradient(circle at 50% 30%,#23232b,#08080a 70%);display:flex;align-items:center;justify-content:center;height:100dvh;overflow:hidden;color:#000;letter-spacing:-.2px;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;letter-spacing:inherit;text-align:inherit}
input{font-family:inherit}
svg{display:block}

/* ---------- device ---------- */
.device{position:relative;width:417px;height:876px;flex:none;border-radius:70px;padding:12px;transform-origin:center;
 background:linear-gradient(145deg,#4a4a4f,#1d1d20 22%,#2b2b2f 60%,#55555a);box-shadow:inset 0 0 0 1.5px #66666b,inset 0 0 0 5px #121214,0 50px 120px rgba(0,0,0,.65)}
.hb{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3a3e,#6b6b70)}
.hb.a{left:-3px;top:150px;height:32px}.hb.b{left:-3px;top:210px;height:62px}.hb.c{left:-3px;top:286px;height:62px}.hb.d{right:-3px;top:240px;height:96px}
.phone{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;isolation:isolate}
#screen{position:absolute;inset:0}
@media (max-width:520px){
 body{background:#000}
 .device{width:100vw;height:100dvh;padding:0;border-radius:0;background:#000;box-shadow:none;transform:none!important}
 .hb{display:none}
 .phone{width:100vw;height:100dvh;border-radius:0}
}

/* ---------- island / status ---------- */
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000;z-index:300;
 transition:all .5s cubic-bezier(.3,1.25,.45,1);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;pointer-events:none}
#island .it{opacity:0;transition:opacity .15s;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;font-weight:600;white-space:nowrap;width:100%}
#island .it .ic{width:26px;height:26px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
#island .it small{display:block;font-size:11px;line-height:1.1;font-weight:500;color:#a1a1a6;margin-bottom:1px}
#island .it .tx{overflow:hidden;text-overflow:ellipsis}
#island.ex{width:350px;height:44px;border-radius:22px;top:9px}
#island.ex .it{opacity:1;transition:opacity .25s .18s}
.sb{height:54px;display:flex;align-items:center;flex:none;position:relative;z-index:5;font-size:17px;font-weight:600;color:#000}
.sb.lt{color:#fff}
.sb .l,.sb .r{flex:1;display:flex;align-items:center;justify-content:center;padding-top:5px}
.sb .l{padding-left:14px}.sb .r{gap:6px;padding-right:12px}
.sb .m{width:126px;flex:none}
@media (max-width:520px){
 #island{top:calc(env(safe-area-inset-top) + 6px);opacity:0;width:120px}
 #island.ex{opacity:1;width:calc(100% - 20px);top:calc(env(safe-area-inset-top) + 6px)}
 .sb{height:max(env(safe-area-inset-top),14px)}
 .sb .l,.sb .r,.sb .m{display:none!important}
}

/* ---------- layers ---------- */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
#home{z-index:1}
#home .hiz{pointer-events:none}
#app{z-index:10;background:#fff;display:none}
#app.dk{background:#000}
.view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:inherit}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.hiz{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:40;cursor:pointer;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px}
.hi{display:block;width:139px;height:5px;border-radius:3px;background:#000}
.hi.lt{background:#fff}

/* ---------- wallpapers ---------- */
.w1{background:radial-gradient(120% 70% at 85% 10%,#ff9a62 0%,rgba(255,154,98,0) 55%),radial-gradient(90% 60% at 10% 40%,#c04dd6 0%,rgba(192,77,214,0) 60%),radial-gradient(120% 80% at 70% 90%,#3a2bd1 0%,rgba(58,43,209,0) 65%),linear-gradient(170deg,#7b2ff7,#f05a7e 55%,#2b1a8f)}
.w2{background:radial-gradient(100% 60% at 20% 15%,#2dd4bf 0%,rgba(45,212,191,0) 55%),radial-gradient(90% 60% at 90% 55%,#3b82f6 0%,rgba(59,130,246,0) 60%),linear-gradient(170deg,#0f766e,#1e3a8a 60%,#0b1020)}

/* ---------- lock ---------- */
.lock{color:#fff;text-align:center;touch-action:none;will-change:transform}
.lk-date{font-size:21px;font-weight:600;margin-top:14px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.15)}
.lk-time{font-size:96px;font-weight:600;letter-spacing:-3px;line-height:1;margin-top:2px;text-shadow:0 2px 20px rgba(0,0,0,.12);font-feature-settings:"tnum"}
.lk-notis{position:absolute;left:10px;right:10px;bottom:150px;display:flex;flex-direction:column;gap:8px}
.ln,.nt{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(246,246,248,.62);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border-radius:22px;padding:12px 14px;color:#000}
.ln .tx,.nt .tx{flex:1;min-width:0}
.ln .t1,.nt .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ln .t1 b,.nt .t1 b{font-size:15px;font-weight:600}
.ln .t1 span,.nt .t1 span{font-size:13px;color:rgba(0,0,0,.5)}
.ln .t2,.nt .t2{font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-btn{position:absolute;bottom:46px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center}
.lk-btn.l{left:46px}.lk-btn.r{right:46px}
.lk-hint{position:absolute;bottom:26px;left:0;right:0;font-size:15px;font-weight:500;opacity:.85;animation:pulse 2.4s infinite}
.lock>.hiz{pointer-events:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
/* passcode */
.pass{color:#fff}
.pass-bl{position:absolute;inset:-30px;background:inherit;filter:blur(28px) brightness(.6);z-index:0}
.pass .sb,.pass-c,.pass-f{position:relative;z-index:1}
.pass-c{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:40px}
.pass-t{font-size:20px;font-weight:500;margin-top:14px}
.dots{display:flex;gap:24px;margin:22px 0 46px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.6px solid #fff;transition:background .1s}
.dots i.f{background:#fff}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-18px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(6px)}}
.kp{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.kp button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.17);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s;color:#fff;text-align:center}
.kp button:active{background:rgba(255,255,255,.55)}
.kp b{font-size:37px;font-weight:400;line-height:1}
.kp small{font-size:10px;font-weight:600;letter-spacing:2.4px;margin-top:1px;min-height:12px}
.pass-f{display:flex;justify-content:space-between;padding:0 58px 58px;font-size:17px}

/* ---------- home ---------- */
.home{color:#fff}
.hcont{flex:1;padding:6px 0 0}
.wdg{margin:4px 22px 0;height:158px;border-radius:22px;overflow:hidden;position:relative}
.wlabel{text-align:center;font-size:12px;font-weight:500;margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.cw{background:#fff;color:#000;display:flex;padding:16px}
.cw .l{width:42%}.cw .l small{color:#FF3B30;font-size:13px;font-weight:700}
.cw .l b{display:block;font-size:46px;font-weight:300;line-height:1;margin-top:2px}
.cw .ev{display:flex;gap:7px;margin-bottom:9px;font-size:13px;line-height:1.25}
.cw .ev i{width:3.5px;border-radius:2px;flex:none}
.cw .ev span{display:block;color:#8e8e93;font-size:12px}
.ww{background:linear-gradient(180deg,#3d8ff5,#7ab8fa);color:#fff;padding:14px 16px}
.ww b{font-size:15px;font-weight:600}.ww .tp{font-size:44px;font-weight:300;line-height:1.1}
.ww .fc{position:absolute;right:16px;top:14px;text-align:right;font-size:13px;font-weight:500}
.ww .hr{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:500;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;padding:26px 14px 0}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center}
.ap span{font-size:12px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap}
.ap:active .ico{filter:brightness(.75)}
.ico{position:relative;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18);overflow:visible}
.ico>svg{width:100%;height:100%;border-radius:inherit}
.bdg{position:absolute;top:-7px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:#FF3B30;color:#fff;font-style:normal;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 7px;text-shadow:none}
.lk{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}
.spot{position:absolute;left:50%;transform:translateX(-50%);bottom:120px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:94px;border-radius:36px;background:rgba(255,255,255,.26);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
@media (max-width:520px){.dock{bottom:calc(14px + env(safe-area-inset-bottom))}.spot{bottom:calc(120px + env(safe-area-inset-bottom))}}

/* ---------- iOS chrome ---------- */
.nb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;position:relative;font-size:17px}
.nb .bk{display:flex;align-items:center;gap:3px;color:var(--blue);padding:6px 4px;max-width:45%}
.nb .bk svg{flex:none}
.nb .tt{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;text-align:center}
.nb .rt{color:var(--blue);display:flex;gap:18px;align-items:center;padding-right:8px}
.lt{font-size:34px;font-weight:700;letter-spacing:.2px;padding:0 16px 8px}
.srch{margin:0 16px 10px;background:rgba(118,118,128,.12);border-radius:10px;height:36px;display:flex;align-items:center;gap:6px;padding:0 8px;color:#8e8e93;font-size:17px;flex:none}
.g2{background:var(--bg2)}
.grp{background:#fff;border-radius:10px;margin:0 16px 22px;overflow:hidden}
.ghd{font-size:13px;color:#6d6d72;padding:0 32px 6px;text-transform:uppercase}
.tabbar{flex:none;height:83px;border-top:.5px solid rgba(0,0,0,.2);background:rgba(249,249,249,.94);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding-top:7px}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#999;width:70px}
.tabbar div.on{color:var(--blue)}
.tabbar svg{width:28px;height:26px}
.toolbar{flex:none;height:83px;border-top:.5px solid rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:flex-start;padding:12px 20px 0;color:var(--blue);font-size:11px}
.toolbar span{color:#000;font-size:11.5px;text-align:center;line-height:1.3}

/* list rows */
.mrow{display:flex;width:100%;text-align:left;padding:10px 16px 11px 0;margin-left:26px;border-bottom:.5px solid var(--sep);position:relative}
.mrow .dot{position:absolute;left:-17px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.mrow .m{flex:1;min-width:0}
.mrow .h{display:flex;justify-content:space-between;align-items:baseline}
.mrow .h b{font-size:17px;font-weight:600}
.mrow .h span{font-size:15px;color:#8e8e93;display:flex;align-items:center;gap:6px}
.mrow .s{font-size:15px;margin-top:1px}
.mrow .p{font-size:15px;color:#8e8e93;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.mrow:active{background:#e5e5ea}

/* kakao-like */
.kt{background:#fff}
.kt-h{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px;flex:none}
.kt-h b{font-size:22px;font-weight:700}
.kt-h .ic{display:flex;gap:18px}
.kt-row{display:flex;gap:12px;align-items:center;padding:9px 18px;width:100%;text-align:left}
.kt-row:active{background:#f2f2f2}
.kav{width:48px;height:48px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden}
.kav img,.km .av img{width:100%;height:100%;object-fit:cover;display:block}
.kav.col{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.5px;background:#fff!important;border-radius:19px}
.kav.col img{border-radius:8px}
.kt-row .m{flex:1;min-width:0}
.kt-row .m b{font-size:15.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.kt-row .m b small{color:#9a9a9a;font-weight:500;font-size:14px}
.kt-row .m span{font-size:13.5px;color:#888;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kt-row .r{text-align:right;font-size:11.5px;color:#aaa;align-self:flex-start;padding-top:4px}
.kt-row .r i{display:inline-block;background:#FA5A3C;color:#fff;font-style:normal;font-size:11.5px;font-weight:700;min-width:20px;height:20px;line-height:20px;border-radius:10px;text-align:center;padding:0 6px;margin-top:6px}
.kt-c{background:#BACEE0}
.kt-ch{display:flex;align-items:center;gap:10px;padding:2px 12px 10px;flex:none;background:#BACEE0}
.kt-ch b{flex:1;font-size:17px;font-weight:600}
.kt-ch small{color:#55606b;font-weight:500;font-size:15px}
.kt-ds{display:table;margin:14px auto 10px;background:rgba(0,0,0,.12);color:#fff;font-size:12px;padding:4px 14px;border-radius:12px}
.km{display:flex;gap:7px;margin:4px 10px;align-items:flex-end}
.km.me{justify-content:flex-end}
.km .av{width:38px;height:38px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;align-self:flex-start;overflow:hidden}
.km .nm{font-size:12.5px;color:#4a5560;margin:0 0 4px 1px}
.km .bb{max-width:230px;padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.42;background:#fff;word-break:keep-all;overflow-wrap:anywhere}
.km .bb{color:#000}
.km.me .bb{background:#FEE500}
.km .tm{font-size:10.5px;color:#556270;white-space:nowrap;margin-bottom:1px}
.km.cont .av{visibility:hidden}.km.cont .nm{display:none}
.kt-in{flex:none;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px 30px}
.kt-in .f{flex:1;background:#f3f3f3;border-radius:20px;height:38px;display:flex;align-items:center;padding:0 14px;color:#aaa;font-size:15px}

/* iMessage */
.imh{display:flex;flex-direction:column;align-items:center;padding:0 0 10px;border-bottom:.5px solid rgba(0,0,0,.15);flex:none;position:relative;background:rgba(249,249,249,.94)}
.imh .bk{position:absolute;left:8px;top:8px;color:var(--blue);display:flex;align-items:center;gap:3px;font-size:17px}
.imav{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#a5abb5,#858a94);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:500}
.imh b{font-size:12px;font-weight:500;margin-top:5px;display:flex;align-items:center;gap:2px}
.imb{max-width:270px;padding:8px 13px;border-radius:19px;font-size:16.5px;line-height:1.33;margin:2px 14px;word-break:keep-all;overflow-wrap:anywhere}
.imb.th{background:#E9E9EB;align-self:flex-start}
.imb.me{background:#34C759;color:#fff;align-self:flex-end}
.imb a{color:inherit}
.imt{text-align:center;font-size:11.5px;color:#8e8e93;margin:14px 0 6px}
.imt b{font-weight:600}
.imin{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 30px}
.imin .f{flex:1;border:1px solid #d1d1d6;border-radius:20px;height:36px;display:flex;align-items:center;padding:0 14px;color:#c7c7cc;font-size:16px}
.qr{display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.qr button{border:1.5px solid var(--blue);color:var(--blue);border-radius:20px;padding:10px 14px;font-size:15px;text-align:center;font-weight:500;background:#fff}
.qr button:active{background:#e8f1ff}

/* mail detail */
.md{padding:6px 16px 30px}
.md .from{display:flex;gap:10px;align-items:center;padding:6px 0 12px;border-bottom:.5px solid var(--sep)}
.md .from .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#a5abb5,#858a94);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
.md .from b{font-size:17px;font-weight:600;display:block}
.md .from span{font-size:14px;color:#8e8e93}
.md h2{font-size:20px;font-weight:700;line-height:1.3;margin:14px 0 4px}
.md .dt{font-size:14px;color:#8e8e93;margin-bottom:16px}
.md .bd{font-size:16px;line-height:1.6;white-space:pre-line}
.md .tbl{border:1px solid #e5e5ea;border-radius:10px;margin:12px 0;overflow:hidden;white-space:normal}
.md .tbl div{display:flex;justify-content:space-between;padding:9px 12px;font-size:15px;border-bottom:1px solid #f0f0f2}
.md .tbl div:last-child{border:0}
.ok{color:#34C759;font-weight:600}.no{color:#FF3B30;font-weight:600}.wt{color:#FF9500;font-weight:600}

/* calendar */
.cal .nb .bk,.cal .nb .rt{color:#FF3B30}
.cm{font-size:30px;font-weight:700;padding:0 16px 10px;display:flex;justify-content:space-between;align-items:center}
.cm .ar{display:flex;gap:22px;color:#FF3B30}
.cw7{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:#8e8e93;text-align:center;padding:0 8px 6px;border-bottom:.5px solid var(--sep);flex:none}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 8px 6px;flex:none}
.cday{height:50px;display:flex;flex-direction:column;align-items:center;padding-top:6px;font-size:19px;border-top:.5px solid #f0f0f2}
.cday span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cday.wk span{color:#8e8e93}
.cday.td span{color:#FF3B30;font-weight:600}
.cday.sel span{background:#000;color:#fff;font-weight:600}
.cday.sel.td span{background:#FF3B30;color:#fff}
.cday i{width:5px;height:5px;border-radius:50%;background:#bdbdc2;margin-top:2px}
.cday.e0 i{visibility:hidden}
.clist{border-top:.5px solid var(--sep)}
.cev{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--sep);width:100%;text-align:left}
.cev i{width:4px;height:38px;border-radius:2px;flex:none}
.cev b{font-size:16px;font-weight:500;flex:1}
.cev span{font-size:14px;color:#8e8e93;text-align:right}
.cev:active{background:#f2f2f7}
.empty{text-align:center;color:#8e8e93;font-size:15px;padding:30px}
.ced{padding:4px 16px}

A.shoot=()=>{const i=$('#cin');const v=(i&&i.value||'').trim();if(v.length<4){i&&i.focus();island('4자리 코드를 입력하세요','카메라','📷');return}const f=$('.cam-vf');f&&f.animate([{opacity:1},{opacity:.1},{opacity:1}],{duration:220});setTimeout(()=>submitCode(v),200)};
function submitCode(code){
 const idx=STATIONS.findIndex(s=>s.code===code);const i=$('#cin');
 if(idx<0){if(i){i.classList.add('shake');setTimeout(()=>i.classList.remove('shake'),450);i.value=''}vib([70,50,70]);alertIOS('인식할 수 없는 코드예요','포스터의 4자리 숫자를 다시 확인해주세요.');return}
 if(idx<G.step){alertIOS('✅ 이미 찾은 장소예요',`${STATIONS[idx].place} — 조각 「${STATIONS[idx].piece}」`);return}
 if(idx>G.step){alertIOS('😮 순서가 아니에요!',`이 코드는 <b>${idx+1}번째</b> 장소예요.<br>지금은 <b>${G.step+1}번째</b> 단서를 따라가야 해요.`);return}
 showQuiz(idx);
}
function showQuiz(idx,retry){
 const s=STATIONS[idx];
 sheet(`<div class="sht"><b>📍 ${s.place} 도착!</b><span style="color:#8e8e93;font-size:15px">${idx+1}/4</span></div>
 <div class="qcard"><small>OX 퀴즈 ${retry?'· 다시 도전':''}</small>${s.quiz.q}</div>
 <div class="ox"><button class="o1" data-act="ox" data-arg="${idx}|1">O</button><button class="x1" data-act="ox" data-arg="${idx}|0">X</button></div>`,true);
}
A.ox=arg=>{
 const [i,v]=arg.split('|');const s=STATIONS[+i];const ok=(v==='1')===s.quiz.a;
 if(!ok){G.wrong++;save2();vib([70,50,70]);sheet(`<div class="sht"><b>😢 아쉬워요!</b></div><div class="qcard" style="font-size:16px;font-weight:500">${s.quiz.exp}</div><button class="bigbtn" data-act="retry" data-arg="${i}">다시 풀기</button>`,true);return}
 G.step=+i+1;save2();updAT();vib(40);
 const nid=ORDER2[G.step];const nap=CASE2.apps[nid];
 sheet(`<div style="text-align:center;font-size:52px;margin-top:6px">🎉</div><div style="text-align:center;font-size:22px;font-weight:700">정답!</div>
 <div class="qcard" style="font-size:15.5px;font-weight:500;margin-top:12px">${s.quiz.exp}</div>
 <div class="pcs">${STATIONS.map((x,j)=>`<span class="${j<G.step?'g':''}">${j<G.step?x.piece:'?'}</span>`).join('')}</div>
 <div style="text-align:center;font-size:15px;color:#3c3c43;margin-bottom:12px">글자 조각 <b>「${s.piece}」</b> 획득 · <b>${nap.name}</b> 앱 잠금 해제 🔓</div>
 <button class="bigbtn" style="background:#0d9488" data-act="afterOk" data-arg="${nid}">'${nap.name}' 열기</button>`,true);
};
A.retry=i=>showQuiz(+i,true);
A.afterOk=id=>{closeSheets();if(G.app){G.app=null;G.nav=[]}renderHome();openDirect(id);save2()};
function voiceView(){
 const open=G.vmOpen;
 const bars=[...Array(46)].map((_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*1.3)*Math.cos(i*.4))*56}px"></i>`).join('');
 return `${NB({back:'',right:'편집'}).replace('<span></span>','')}<div class="lt" style="color:#fff">모든 녹음</div><div class="srch" style="background:#1c1c1e">${SV.search} 검색</div>
 <div class="scroll">
  <div class="vrow" data-act="vmToggle" data-arg="last" style="cursor:pointer"><b>마지막 단서</b><div class="s"><span>2026. 11. 19.</span><span>0:14</span></div>
  ${open==='last'?`<div class="vexp"><div class="wave" id="wave">${bars}</div><div class="vtime"><span id="vcur">0:00</span><span>-0:14</span></div>
   <div class="vctl"><span>${SV.bk15}</span><button class="vplay" data-act="vmPlay">${SV.play}</button><span style="transform:scaleX(-1)">${SV.bk15}</span></div>
   <div class="vtr" id="vtr" style="display:none">📝 받아쓰기<br>"마지막은… <b>기와지붕 아래, 옛 선비들의 마을</b>이야. 한옥 대문 앞을 잘 봐. 거기까지 오면 거의 다 왔어! 🏯"</div></div>`:''}</div>
  <div class="vrow"><b>축제 사회 멘트 연습</b><div class="s"><span>2026. 11. 16.</span><span>2:41</span></div></div>
  <div class="vrow"><b>회의 녹음 (기획단)</b><div class="s"><span>2026. 11. 12.</span><span>18:07</span></div></div>
 </div><div style="height:110px;display:flex;align-items:center;justify-content:center;border-top:.5px solid #2c2c2e;flex:none"><div style="width:66px;height:66px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center"><div style="width:52px;height:52px;border-radius:50%;background:#FF3B30"></div></div></div>`;
}
A.vmToggle=(a,el,e)=>{if(e&&e.target.closest('.vexp'))return;G.vmOpen=G.vmOpen===a?null:a;clearInterval(vmTimer);renderApp()};
A.vmPlay=(a,el)=>{
 clearInterval(vmTimer);const bars=[...document.querySelectorAll('#wave i')];let t=0;el.innerHTML=SV.pause;
 setTimeout(()=>{const v=$('#vtr');if(v){v.style.display='';v.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:400})}},1600);
 vmTimer=setInterval(()=>{t+=.25;const p=Math.min(1,t/14);bars.forEach((b,i)=>b.classList.toggle('p',i/bars.length<p));const c=$('#vcur');if(c)c.textContent='0:'+String(Math.floor(t)).padStart(2,'0');if(p>=1){clearInterval(vmTimer);const b=$('.vplay');b&&(b.innerHTML=SV.play)}},250);
};
function secretView(){
 return `<div class="nb"><button class="bk" data-act="pop">${SV.chev}<span>앨범</span></button><div class="tt">가려진 항목</div><span></span></div>
 <div class="scroll" style="display:flex;flex-direction:column;align-items:center;padding:40px 24px;text-align:center">
  <div style="width:74px;height:74px;border-radius:50%;background:#e5e5ea;display:flex;align-items:center;justify-content:center"><svg width="30" height="38" viewBox="0 0 18 24"><path d="M4 10V6.5a5 5 0 0 1 10 0V10" stroke="#8e8e93" stroke-width="2.2" fill="none"/><rect x="1" y="10" width="16" height="13" rx="3" fill="#8e8e93"/></svg></div>
  <div style="font-size:22px;font-weight:700;margin-top:16px">가려진 앨범이 잠겨 있음</div>
  <div style="font-size:15px;color:#8e8e93;margin-top:6px;line-height:1.5">모은 글자 조각 4개를 순서대로 입력하면<br>앨범을 볼 수 있어요.</div>
  <div class="pcs" style="margin:22px 0">${STATIONS.map((s,i)=>`<span class="${i<G.step?'g':''}">${i<G.step?s.piece:'?'}</span>`).join('')}</div>
  <input id="fw" maxlength="8" placeholder="암호 입력" style="width:100%;height:50px;border-radius:12px;border:0;background:#fff;font-size:22px;text-align:center;letter-spacing:6px;outline:none">
  <button class="bigbtn" style="margin:12px 0 0;width:100%" data-act="final">앨범 보기</button></div>`;
}
A.final=()=>{const v=($('#fw').value||'').replace(/\s/g,'');if(v===FINAL_WORD){G.stage='end';G.done=true;G.end=Date.now();save2();R()}else{const f=$('#fw');f.classList.add('shake');vib([70,50,70]);setTimeout(()=>f.classList.remove('shake'),450);island('암호가 달라요. 조각 순서를 확인하세요','비밀앨범','🔐')}};

 scr.innerHTML=`<div class="layer gm">${SB(true)}<div class="scroll"><div class="story">
  <div class="cs">ADMIN</div><h1>⚙️ 사건2 현장 설정</h1>
  <p style="font-size:14.5px">장소마다 <b style="color:#fff">QR 포스터</b>를 붙이면 돼요. 장소·코드·퀴즈는 HTML 파일 위쪽의 <code>STATIONS</code>에서 바꿀 수 있어요.</p>
  <table class="adm"><tr><th>#</th><th>장소</th><th>코드</th><th>조각</th></tr>${STATIONS.map((s,i)=>`<tr><td>${i+1}</td><td>${s.place}</td><td><b>${s.code}</b></td><td>${s.piece}</td></tr>`).join('')}</table>
  <p style="font-size:14.5px">폰 비밀번호: <b style="color:#fff">${C2_PASS}</b> · 최종 암호: <b style="color:#fff">${FINAL_WORD}</b><br>QR 주소: <code>사이트주소/#k코드</code> (예: #k2741)</p><p style="font-size:12.5px;color:#8e8e93">사진: Unsplash (무료 라이선스) · 국가장학금 포스터: 교육부·한국장학재단</p>
  <button class="gbtn" data-act="reset2">🧹 사건2 진행 초기화 (이 기기)</button><button class="gbtn s" data-act="menu">돌아가기</button></div></div></div>`;
}
A.reset2=()=>{store.del('kmu_c2_v2');alertIOS('초기화했어요 🧹','이 기기의 사건2 진행 기록을 지웠어요.')};

/* =====================================================================
   해시(QR)
   ===================================================================== */
function handleHash(){
 const h=(location.hash||'').slice(1);const m=h.match(/^k(\d{4})$/);
 if(m){MODE='c2';C=CASE2;G=loadG2();
  if(G.unlocked){G.stage='phone';R();setTimeout(()=>submitCode(m[1]),500)}
  else{G.pending=m[1];if(G.stage==='intro'){}else G.stage='lock';save2();R()}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}return true}
 if(h==='case1'){A.start1();return true}
 if(h==='case2'){A.start2();return true}
 if(h==='admin'){MODE='admin';R();return true}
 return false;
}
addEventListener('hashchange',handleHash);
if(!handleHash())R();
