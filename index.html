<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>계명인의 폰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--blue:#007AFF;--red:#FF3B30;--green:#34C759;--gray:#8E8E93;--sep:rgba(60,60,67,.18);--bg2:#F2F2F7;
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--f);-webkit-font-smoothing:antialiased;background:#08080a radial-gradient(circle at 50% 30%,#23232b,#08080a 70%);display:flex;align-items:center;justify-content:center;height:100dvh;overflow:hidden;color:#000;letter-spacing:-.2px;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;letter-spacing:inherit;text-align:inherit}
input{font-family:inherit}
svg{display:block}

/* ---------- device ---------- */
.device{position:relative;width:417px;height:876px;flex:none;border-radius:70px;padding:12px;transform-origin:center;
 background:linear-gradient(145deg,#4a4a4f,#1d1d20 22%,#2b2b2f 60%,#55555a);box-shadow:inset 0 0 0 1.5px #66666b,inset 0 0 0 5px #121214,0 50px 120px rgba(0,0,0,.65)}
.hb{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3a3e,#6b6b70)}
.hb.a{left:-3px;top:150px;height:32px}.hb.b{left:-3px;top:210px;height:62px}.hb.c{left:-3px;top:286px;height:62px}.hb.d{right:-3px;top:240px;height:96px}
.phone{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;isolation:isolate}
#screen{position:absolute;inset:0}
@media (max-width:520px){
 body{background:#000}
 .device{width:100vw;height:100dvh;padding:0;border-radius:0;background:#000;box-shadow:none;transform:none!important}
 .hb{display:none}
 .phone{width:100vw;height:100dvh;border-radius:0}
}

/* ---------- island / status ---------- */
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000;z-index:300;
 transition:all .5s cubic-bezier(.3,1.25,.45,1);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;pointer-events:none}
#island .it{opacity:0;transition:opacity .15s;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;font-weight:600;white-space:nowrap;width:100%}
#island .it .ic{width:26px;height:26px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
#island .it small{display:block;font-size:11px;line-height:1.1;font-weight:500;color:#a1a1a6;margin-bottom:1px}
#island .it .tx{overflow:hidden;text-overflow:ellipsis}
#island.ex{width:350px;height:44px;border-radius:22px;top:9px}
#island.ex .it{opacity:1;transition:opacity .25s .18s}
.sb{height:54px;display:flex;align-items:center;flex:none;position:relative;z-index:5;font-size:17px;font-weight:600;color:#000}
.sb.lt{color:#fff}
.sb .l,.sb .r{flex:1;display:flex;align-items:center;justify-content:center;padding-top:5px}
.sb .l{padding-left:14px}.sb .r{gap:6px;padding-right:12px}
.sb .m{width:126px;flex:none}
@media (max-width:520px){
 #island{top:calc(env(safe-area-inset-top) + 6px);opacity:0;width:120px}
 #island.ex{opacity:1;width:calc(100% - 20px);top:calc(env(safe-area-inset-top) + 6px)}
 .sb{height:max(env(safe-area-inset-top),14px)}
 .sb .l,.sb .r,.sb .m{display:none!important}
}

/* ---------- layers ---------- */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
#home{z-index:1}
#home .hiz{pointer-events:none}
#app{z-index:10;background:#fff;display:none}
#app.dk{background:#000}
.view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:inherit}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.hiz{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:40;cursor:pointer;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px}
.hi{display:block;width:139px;height:5px;border-radius:3px;background:#000}
.hi.lt{background:#fff}

/* ---------- wallpapers ---------- */
.w1{background:radial-gradient(120% 70% at 85% 10%,#ff9a62 0%,rgba(255,154,98,0) 55%),radial-gradient(90% 60% at 10% 40%,#c04dd6 0%,rgba(192,77,214,0) 60%),radial-gradient(120% 80% at 70% 90%,#3a2bd1 0%,rgba(58,43,209,0) 65%),linear-gradient(170deg,#7b2ff7,#f05a7e 55%,#2b1a8f)}
.w2{background:radial-gradient(100% 60% at 20% 15%,#2dd4bf 0%,rgba(45,212,191,0) 55%),radial-gradient(90% 60% at 90% 55%,#3b82f6 0%,rgba(59,130,246,0) 60%),linear-gradient(170deg,#0f766e,#1e3a8a 60%,#0b1020)}

/* ---------- lock ---------- */
.lock{color:#fff;text-align:center;touch-action:none;will-change:transform}
.lk-date{font-size:21px;font-weight:600;margin-top:14px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.15)}
.lk-time{font-size:96px;font-weight:600;letter-spacing:-3px;line-height:1;margin-top:2px;text-shadow:0 2px 20px rgba(0,0,0,.12);font-feature-settings:"tnum"}
.lk-notis{position:absolute;left:10px;right:10px;bottom:150px;display:flex;flex-direction:column;gap:8px}
.ln,.nt{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(246,246,248,.62);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border-radius:22px;padding:12px 14px;color:#000}
.ln .tx,.nt .tx{flex:1;min-width:0}
.ln .t1,.nt .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ln .t1 b,.nt .t1 b{font-size:15px;font-weight:600}
.ln .t1 span,.nt .t1 span{font-size:13px;color:rgba(0,0,0,.5)}
.ln .t2,.nt .t2{font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-btn{position:absolute;bottom:46px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center}
.lk-btn.l{left:46px}.lk-btn.r{right:46px}
.lk-hint{position:absolute;bottom:26px;left:0;right:0;font-size:15px;font-weight:500;opacity:.85;animation:pulse 2.4s infinite}
.lock>.hiz{pointer-events:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
/* passcode */
.pass{color:#fff}
.pass-bl{position:absolute;inset:-30px;background:inherit;filter:blur(28px) brightness(.6);z-index:0}
.pass .sb,.pass-c,.pass-f{position:relative;z-index:1}
.pass-c{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:40px}
.pass-t{font-size:20px;font-weight:500;margin-top:14px}
.dots{display:flex;gap:24px;margin:22px 0 46px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.6px solid #fff;transition:background .1s}
.dots i.f{background:#fff}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-18px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(6px)}}
.kp{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.kp button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.17);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s;color:#fff;text-align:center}
.kp button:active{background:rgba(255,255,255,.55)}
.kp b{font-size:37px;font-weight:400;line-height:1}
.kp small{font-size:10px;font-weight:600;letter-spacing:2.4px;margin-top:1px;min-height:12px}
.pass-f{display:flex;justify-content:space-between;padding:0 58px 58px;font-size:17px}

/* ---------- home ---------- */
.home{color:#fff}
.hcont{flex:1;padding:6px 0 0}
.wdg{margin:4px 22px 0;height:158px;border-radius:22px;overflow:hidden;position:relative}
.wlabel{text-align:center;font-size:12px;font-weight:500;margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.cw{background:#fff;color:#000;display:flex;padding:16px}
.cw .l{width:42%}.cw .l small{color:#FF3B30;font-size:13px;font-weight:700}
.cw .l b{display:block;font-size:46px;font-weight:300;line-height:1;margin-top:2px}
.cw .ev{display:flex;gap:7px;margin-bottom:9px;font-size:13px;line-height:1.25}
.cw .ev i{width:3.5px;border-radius:2px;flex:none}
.cw .ev span{display:block;color:#8e8e93;font-size:12px}
.ww{background:linear-gradient(180deg,#3d8ff5,#7ab8fa);color:#fff;padding:14px 16px}
.ww b{font-size:15px;font-weight:600}.ww .tp{font-size:44px;font-weight:300;line-height:1.1}
.ww .fc{position:absolute;right:16px;top:14px;text-align:right;font-size:13px;font-weight:500}
.ww .hr{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:500;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;padding:26px 14px 0}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center}
.ap span{font-size:12px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap}
.ap:active .ico{filter:brightness(.75)}
.ico{position:relative;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18);overflow:visible}
.ico>svg{width:100%;height:100%;border-radius:inherit}
.bdg{position:absolute;top:-7px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:#FF3B30;color:#fff;font-style:normal;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 7px;text-shadow:none}
.lk{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}
.spot{position:absolute;left:50%;transform:translateX(-50%);bottom:120px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:94px;border-radius:36px;background:rgba(255,255,255,.26);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
@media (max-width:520px){.dock{bottom:calc(14px + env(safe-area-inset-bottom))}.spot{bottom:calc(120px + env(safe-area-inset-bottom))}}

/* ---------- iOS chrome ---------- */
.nb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;position:relative;font-size:17px}
.nb .bk{display:flex;align-items:center;gap:3px;color:var(--blue);padding:6px 4px;max-width:45%}
.nb .bk svg{flex:none}
.nb .tt{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;text-align:center}
.nb .rt{color:var(--blue);display:flex;gap:18px;align-items:center;padding-right:8px}
.lt{font-size:34px;font-weight:700;letter-spacing:.2px;padding:0 16px 8px}
.srch{margin:0 16px 10px;background:rgba(118,118,128,.12);border-radius:10px;height:36px;display:flex;align-items:center;gap:6px;padding:0 8px;color:#8e8e93;font-size:17px;flex:none}
.g2{background:var(--bg2)}
.grp{background:#fff;border-radius:10px;margin:0 16px 22px;overflow:hidden}
.ghd{font-size:13px;color:#6d6d72;padding:0 32px 6px;text-transform:uppercase}
.tabbar{flex:none;height:83px;border-top:.5px solid rgba(0,0,0,.2);background:rgba(249,249,249,.94);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding-top:7px}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#999;width:70px}
.tabbar div.on{color:var(--blue)}
.tabbar svg{width:28px;height:26px}
.toolbar{flex:none;height:83px;border-top:.5px solid rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:flex-start;padding:12px 20px 0;color:var(--blue);font-size:11px}
.toolbar span{color:#000;font-size:11.5px;text-align:center;line-height:1.3}

/* list rows */
.mrow{display:flex;width:100%;text-align:left;padding:10px 16px 11px 0;margin-left:26px;border-bottom:.5px solid var(--sep);position:relative}
.mrow .dot{position:absolute;left:-17px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.mrow .m{flex:1;min-width:0}
.mrow .h{display:flex;justify-content:space-between;align-items:baseline}
.mrow .h b{font-size:17px;font-weight:600}
.mrow .h span{font-size:15px;color:#8e8e93;display:flex;align-items:center;gap:6px}
.mrow .s{font-size:15px;margin-top:1px}
.mrow .p{font-size:15px;color:#8e8e93;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.mrow:active{background:#e5e5ea}

/* kakao-like */
.kt{background:#fff}
.kt-h{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px;flex:none}
.kt-h b{font-size:22px;font-weight:700}
.kt-h .ic{display:flex;gap:18px}
.kt-row{display:flex;gap:12px;align-items:center;padding:9px 18px;width:100%;text-align:left}
.kt-row:active{background:#f2f2f2}
.kav{width:48px;height:48px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden}
.kav img,.km .av img{width:100%;height:100%;object-fit:cover;display:block}
.kav.col{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.5px;background:#fff!important;border-radius:19px}
.kav.col img{border-radius:8px}
.kt-row .m{flex:1;min-width:0}
.kt-row .m b{font-size:15.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.kt-row .m b small{color:#9a9a9a;font-weight:500;font-size:14px}
.kt-row .m span{font-size:13.5px;color:#888;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kt-row .r{text-align:right;font-size:11.5px;color:#aaa;align-self:flex-start;padding-top:4px}
.kt-row .r i{display:inline-block;background:#FA5A3C;color:#fff;font-style:normal;font-size:11.5px;font-weight:700;min-width:20px;height:20px;line-height:20px;border-radius:10px;text-align:center;padding:0 6px;margin-top:6px}
.kt-c{background:#BACEE0}
.kt-ch{display:flex;align-items:center;gap:10px;padding:2px 12px 10px;flex:none;background:#BACEE0}
.kt-ch b{flex:1;font-size:17px;font-weight:600}
.kt-ch small{color:#55606b;font-weight:500;font-size:15px}
.kt-ds{display:table;margin:14px auto 10px;background:rgba(0,0,0,.12);color:#fff;font-size:12px;padding:4px 14px;border-radius:12px}
.km{display:flex;gap:7px;margin:4px 10px;align-items:flex-end}
.km.me{justify-content:flex-end}
.km .av{width:38px;height:38px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;align-self:flex-start;overflow:hidden}
.km .nm{font-size:12.5px;color:#4a5560;margin:0 0 4px 1px}
.km .bb{max-width:230px;padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.42;background:#fff;word-break:keep-all;overflow-wrap:anywhere}
.km .bb{color:#000}
.km.me .bb{background:#FEE500}
.km .tm{font-size:10.5px;color:#556270;white-space:nowrap;margin-bottom:1px}
.km.cont .av{visibility:hidden}.km.cont .nm{display:none}
.kt-in{flex:none;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px 30px}
.kt-in .f{flex:1;background:#f3f3f3;border-radius:20px;height:38px;display:flex;align-items:center;padding:0 14px;color:#aaa;font-size:15px}

/* iMessage */
.imh{display:flex;flex-direction:column;align-items:center;padding:0 0 10px;border-bottom:.5px solid rgba(0,0,0,.15);flex:none;position:relative;background:rgba(249,249,249,.94)}
.imh .bk{position:absolute;left:8px;top:8px;color:var(--blue);display:flex;align-items:center;gap:3px;font-size:17px}
.imav{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#a5abb5,#858a94);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:500}
.imh b{font-size:12px;font-weight:500;margin-top:5px;display:flex;align-items:center;gap:2px}
.imb{max-width:270px;padding:8px 13px;border-radius:19px;font-size:16.5px;line-height:1.33;margin:2px 14px;word-break:keep-all;overflow-wrap:anywhere}
.imb.th{background:#E9E9EB;align-self:flex-start}
.imb.me{background:#34C759;color:#fff;align-self:flex-end}
.imb a{color:inherit}
.imt{text-align:center;font-size:11.5px;color:#8e8e93;margin:14px 0 6px}
.imt b{font-weight:600}
.imin{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 30px}
.imin .f{flex:1;border:1px solid #d1d1d6;border-radius:20px;height:36px;display:flex;align-items:center;padding:0 14px;color:#c7c7cc;font-size:16px}
.qr{display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.qr button{border:1.5px solid var(--blue);color:var(--blue);border-radius:20px;padding:10px 14px;font-size:15px;text-align:center;font-weight:500;background:#fff}
.qr button:active{background:#e8f1ff}

/* mail detail */
.md{padding:6px 16px 30px}
.md .from{display:flex;gap:10px;align-items:center;padding:6px 0 12px;border-bottom:.5px solid var(--sep)}
.md .from .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#a5abb5,#858a94);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
.md .from b{font-size:17px;font-weight:600;display:block}
.md .from span{font-size:14px;color:#8e8e93}
.md h2{font-size:20px;font-weight:700;line-height:1.3;margin:14px 0 4px}
.md .dt{font-size:14px;color:#8e8e93;margin-bottom:16px}
.md .bd{font-size:16px;line-height:1.6;white-space:pre-line}
.md .tbl{border:1px solid #e5e5ea;border-radius:10px;margin:12px 0;overflow:hidden;white-space:normal}
.md .tbl div{display:flex;justify-content:space-between;padding:9px 12px;font-size:15px;border-bottom:1px solid #f0f0f2}
.md .tbl div:last-child{border:0}
.ok{color:#34C759;font-weight:600}.no{color:#FF3B30;font-weight:600}.wt{color:#FF9500;font-weight:600}

/* calendar */
.cal .nb .bk,.cal .nb .rt{color:#FF3B30}
.cm{font-size:30px;font-weight:700;padding:0 16px 10px;display:flex;justify-content:space-between;align-items:center}
.cm .ar{display:flex;gap:22px;color:#FF3B30}
.cw7{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:#8e8e93;text-align:center;padding:0 8px 6px;border-bottom:.5px solid var(--sep);flex:none}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 8px 6px;flex:none}
.cday{height:50px;display:flex;flex-direction:column;align-items:center;padding-top:6px;font-size:19px;border-top:.5px solid #f0f0f2}
.cday span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cday.wk span{color:#8e8e93}
.cday.td span{color:#FF3B30;font-weight:600}
.cday.sel span{background:#000;color:#fff;font-weight:600}
.cday.sel.td span{background:#FF3B30;color:#fff}
.cday i{width:5px;height:5px;border-radius:50%;background:#bdbdc2;margin-top:2px}
.cday.e0 i{visibility:hidden}
.clist{border-top:.5px solid var(--sep)}
.cev{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--sep);width:100%;text-align:left}
.cev i{width:4px;height:38px;border-radius:2px;flex:none}
.cev b{font-size:16px;font-weight:500;flex:1}
.cev span{font-size:14px;color:#8e8e93;text-align:right}
.cev:active{background:#f2f2f7}
.empty{text-align:center;color:#8e8e93;font-size:15px;padding:30px}
.ced{padding:4px 16px}
.ced h2{font-size:24px;font-weight:700;margin:4px 0 6px}
.ced .w{color:#8e8e93;font-size:16px;line-height:1.5;margin-bottom:22px}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pt{aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer}
.pa{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pa>img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.pa .vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.1),rgba(0,0,0,.28));pointer-events:none}
.pa span{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.pa .e2{position:absolute;filter:blur(1.5px) drop-shadow(0 4px 6px rgba(0,0,0,.2));opacity:.9}
.pv{flex:1;display:flex;flex-direction:column;background:#fff}
.pv .im{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv .im>img{max-width:100%;max-height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.pcap{padding:12px 16px;font-size:15px;line-height:1.5;color:#3c3c43;min-height:60px}
.ptitle{position:absolute;left:50%;transform:translateX(-50%);text-align:center;font-size:15px;font-weight:600;line-height:1.2}
.ptitle small{display:block;font-size:12px;font-weight:400;color:#8e8e93}
/* screenshot mock */
.shot{position:absolute;inset:0;background:#f2f5fa;display:flex;flex-direction:column;font-size:13px;color:#111}
.shot .top{background:#0a4ea2;color:#fff;padding:26px 14px 12px;font-weight:700;font-size:15px}
.shot .top small{display:block;font-weight:400;opacity:.8;font-size:11px;margin-top:2px}
.shot .cd{background:#fff;margin:12px;border-radius:12px;padding:6px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.shot .cd div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef0f4}
.shot .cd div:last-child{border:0}
.shot .nt2{margin:0 12px;font-size:11px;color:#6b7280;line-height:1.5}
.shot.mini{transform:scale(.33);transform-origin:0 0;width:303%;height:303%}

/* notes */
.notes .nb .bk,.notes .nb .rt{color:#E0A500}
.nrow{display:block;width:100%;text-align:left;padding:11px 16px;border-bottom:.5px solid var(--sep)}
.nrow:last-child{border:0}
.nrow b{font-size:17px;font-weight:600;display:block}
.nrow span{font-size:15px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nrow span em{font-style:normal;color:#3c3c43;margin-right:8px}
.nd{padding:0 20px 40px;font-size:17px;line-height:1.55}
.nd .d{text-align:center;color:#8e8e93;font-size:13px;margin:4px 0 12px}
.nd h1{font-size:27px;font-weight:700;margin-bottom:8px;line-height:1.25}
.nd p{min-height:1em;white-space:pre-wrap}
.ck{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.ck i{width:22px;height:22px;border-radius:50%;border:1.5px solid #c7c7cc;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.ck.on i{background:#E0A500;border-color:#E0A500}
.ck.on span{color:#8e8e93}

/* phone */
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;width:180px;margin:0 auto}
.seg div{flex:1;text-align:center;font-size:13px;font-weight:600;padding:5px;border-radius:7px}
.seg div.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.crow{display:flex;align-items:center;width:100%;text-align:left;padding:9px 16px 9px 0;margin-left:16px;border-bottom:.5px solid var(--sep)}
.crow .m{flex:1}
.crow b{font-size:17px;font-weight:600;display:block}
.crow b.ms{color:#FF3B30}
.crow span{font-size:14px;color:#8e8e93}
.crow .r{font-size:15px;color:#8e8e93;display:flex;gap:10px;align-items:center}

/* bank / campus */
.bk-card{margin:6px 16px 14px;border-radius:20px;padding:20px;color:#fff}
.txr{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:.5px solid var(--sep);background:#fff}
.txr b{font-size:16px;font-weight:600;display:block}.txr span{font-size:13px;color:#8e8e93}
.txr .a{font-weight:700;font-size:16px}

/* voice memo */
.vm{background:#000;color:#fff}
.vm .nb .bk,.vm .nb .rt{color:#0A84FF}
.vrow{padding:12px 16px 12px 0;margin-left:16px;border-bottom:.5px solid #2c2c2e;width:calc(100% - 16px);text-align:left;display:block}
.vrow b{font-size:17px;font-weight:600;display:block}
.vrow .s{display:flex;justify-content:space-between;color:#8e8e93;font-size:15px;margin-top:3px}
.vexp{padding:4px 0 14px}
.wave{display:flex;gap:3px;align-items:center;height:70px;margin:10px 0;position:relative}
.wave i{flex:1;background:#5a5a5e;border-radius:2px}
.wave i.p{background:#fff}
.vctl{display:flex;justify-content:center;align-items:center;gap:40px;margin:6px 0}
.vplay{width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.vtime{display:flex;justify-content:space-between;color:#8e8e93;font-size:12px}
.vtr{background:#1c1c1e;border-radius:12px;padding:14px;font-size:15px;line-height:1.6;margin-top:10px;color:#e5e5ea}

/* camera / scanner */
.cam{background:#000;color:#fff}
.cam-top{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;flex:none}
.cam-vf{flex:1;position:relative;background:radial-gradient(circle at 40% 35%,#4b5563,#1f2937 55%,#0b0f17);overflow:hidden}
.cam-vf .nz{position:absolute;inset:0;opacity:.18;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 .5px,transparent 1px 3px)}
.cam-box{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:220px;height:220px}
.cam-box i{position:absolute;width:44px;height:44px;border-color:#FFD60A;border-style:solid;border-width:0}
.cam-box i:nth-child(1){left:0;top:0;border-left-width:4px;border-top-width:4px;border-top-left-radius:18px}
.cam-box i:nth-child(2){right:0;top:0;border-right-width:4px;border-top-width:4px;border-top-right-radius:18px}
.cam-box i:nth-child(3){left:0;bottom:0;border-left-width:4px;border-bottom-width:4px;border-bottom-left-radius:18px}
.cam-box i:nth-child(4){right:0;bottom:0;border-right-width:4px;border-bottom-width:4px;border-bottom-right-radius:18px}
.cam-box .scanl{position:absolute;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,#FFD60A,transparent);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:14px}50%{top:200px}}
.cam-pill{position:absolute;left:50%;transform:translateX(-50%);top:calc(44% + 132px);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:14px;font-size:13px;white-space:nowrap}
.cam-in{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cam-in input{width:200px;height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;text-align:center;font-size:30px;letter-spacing:14px;font-weight:600;outline:none;padding-left:14px}
.cam-in input::placeholder{color:rgba(255,255,255,.35)}
.cam-in small{font-size:12px;color:rgba(255,255,255,.7)}
.cam-modes{display:flex;justify-content:center;gap:20px;font-size:13px;font-weight:600;color:#d1d1d6;padding:14px 0 10px;flex:none;letter-spacing:.5px}
.cam-modes .on{color:#FFD60A}
.cam-bot{height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 40px 20px;flex:none}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.shutter i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active i{transform:scale(.88)}
.thumb{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,#334155,#64748b)}

/* ---------- overlays ---------- */
.al-bg{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:400;display:flex;align-items:center;justify-content:center;animation:fd .2s}
.al{width:270px;border-radius:14px;background:rgba(242,242,242,.88);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);text-align:center;overflow:hidden;animation:alp .28s cubic-bezier(.2,1.2,.4,1)}
.al .h{padding:19px 16px 16px}
.al b{font-size:17px;font-weight:600;display:block;line-height:1.3}
.al p{font-size:13px;margin-top:4px;line-height:1.4}
.al .bs{display:flex;border-top:.5px solid rgba(60,60,67,.3)}
.al .bs button{flex:1;height:44px;font-size:17px;color:var(--blue);text-align:center}
.al .bs button+button{border-left:.5px solid rgba(60,60,67,.3)}
.al .bs button.b{font-weight:600}.al .bs button.r{color:#FF3B30}
.al .bs.v{flex-direction:column}.al .bs.v button+button{border-left:0;border-top:.5px solid rgba(60,60,67,.3)}
.al .bs button:active{background:rgba(0,0,0,.06)}
@keyframes fd{from{opacity:0}}
@keyframes alp{from{transform:scale(1.15);opacity:0}}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:350;display:flex;align-items:flex-end;animation:fd .25s}
.sh{width:100%;max-height:90%;background:#F2F2F7;border-radius:12px 12px 0 0;overflow-y:auto;padding-bottom:34px;animation:shu .38s cubic-bezier(.2,.9,.3,1)}
.sh::-webkit-scrollbar{display:none}
@keyframes shu{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:6px auto 4px}
.sht{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 14px}
.sht b{font-size:17px;font-weight:600}
.sht button{color:var(--blue);font-size:17px}
.shp{padding:0 20px 14px;font-size:15px;color:#3c3c43;line-height:1.55}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;font-size:16px;border-bottom:.5px solid var(--sep);background:#fff}
.opt:last-child{border:0}
.opt:active{background:#e5e5ea}
.opt .e{font-size:22px}
.bigbtn{display:block;margin:6px 16px 0;width:calc(100% - 32px);height:50px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;text-align:center}
.bigbtn.gr{background:#fff;color:var(--blue)}
.ox{display:flex;gap:12px;margin:6px 16px 0}
.ox button{flex:1;height:96px;border-radius:20px;font-size:46px;font-weight:800;text-align:center;background:#fff}
.ox .o1{color:#007AFF}.ox .x1{color:#FF3B30}
.ox button:active{transform:scale(.97)}
.qcard{background:#fff;border-radius:14px;margin:0 16px 14px;padding:18px;font-size:18px;font-weight:600;line-height:1.5}
.qcard small{display:block;font-size:13px;color:#0d9488;font-weight:700;margin-bottom:6px}
.pcs{display:flex;gap:10px;justify-content:center;margin:12px 0}
.pcs span{width:56px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#c7c7cc;border:2px dashed #d1d1d6}
.pcs span.g{background:#FFF4D6;color:#B45309;border:2px solid #F59E0B}
.nt{position:absolute;left:8px;right:8px;top:8px;z-index:320;box-shadow:0 10px 40px rgba(0,0,0,.25);cursor:pointer;animation:ntd .5s cubic-bezier(.2,1.1,.4,1)}
.nt.out{transition:transform .35s,opacity .35s;transform:translateY(-130%);opacity:0}
@keyframes ntd{from{transform:translateY(-130%)}}
@media (max-width:520px){.nt{top:calc(env(safe-area-inset-top) + 6px)}}

/* assistive touch */
#at{position:absolute;right:6px;top:60%;width:58px;height:58px;border-radius:17px;background:rgba(28,28,30,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:250;display:none;align-items:center;justify-content:center;cursor:pointer;opacity:.85;touch-action:none}
#at.on{display:flex}
#at .r1{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
#at .r2{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center}
#at .r3{width:21px;height:21px;border-radius:50%;background:rgba(255,255,255,.95)}
#at .ab{position:absolute;top:-6px;left:-8px;background:#5E5CE6;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 6px;white-space:nowrap}
.atm-bg{position:absolute;inset:0;z-index:380;background:rgba(0,0,0,.15);animation:fd .2s}
.atm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;border-radius:34px;background:rgba(28,28,30,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:24px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px 0;color:#fff;animation:atp .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes atp{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.atm button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;text-align:center;color:#fff}
.atm .ai{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:23px}
.atm small{display:block;font-size:10.5px;color:#a1a1a6;margin-top:-4px}

/* ---------- game screens ---------- */
.gm{background:#0a0a0c;color:#f2f2f7}
.gm-h{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 4px}
.gm-h h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.gm-h h1 small{font-size:13px;font-weight:600;color:#8e8e93;display:block;letter-spacing:0;margin-bottom:2px}
.chips{display:flex;gap:8px;padding:10px 20px 4px}
.chips span{font-size:13px;font-weight:600;padding:6px 13px;border-radius:16px;background:#1c1c1e;color:#c7c7cc}
.chips span.on{background:#f2f2f7;color:#000}
.pst{position:relative;margin:14px 20px 0;height:250px;border-radius:24px;overflow:hidden;display:block;width:calc(100% - 40px);text-align:left;color:#fff}
.pst .art{position:absolute;inset:0}
.pst .sh2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.82))}
.pst .tx{position:absolute;left:18px;right:18px;bottom:16px}
.pst .tg{display:flex;gap:6px;margin-bottom:8px}
.pst .tg span{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px)}
.pst h2{font-size:25px;font-weight:800;letter-spacing:-.5px}
.pst p{font-size:13px;opacity:.85;margin-top:4px;line-height:1.45}
.pst .new{position:absolute;top:14px;left:14px;background:#FF3B30;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;letter-spacing:.5px}
.pst .cont{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px}
.pst.soon{height:120px;filter:grayscale(1);opacity:.55}
.foot{font-size:12px;color:#636366;text-align:center;padding:22px 20px 40px;line-height:1.7}
.foot button{color:#8e8e93;text-decoration:underline;font-size:12px}
.story{padding:20px 22px 40px}
.story .cs{font-size:12px;font-weight:800;color:#8e8e93;letter-spacing:2px}
.story h1{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:6px 0 16px;line-height:1.2}
.story p{font-size:16px;line-height:1.85;color:#d1d1d6;margin-bottom:14px}
.story .q{border-left:3px solid #5E5CE6;padding:4px 0 4px 14px;color:#fff;font-size:16px;line-height:1.7;margin:16px 0}
.story .lbl{font-size:13px;color:#8e8e93;font-weight:600;margin:22px 0 4px}
.sticky{background:#FFE58A;color:#222;transform:rotate(-1.5deg);padding:16px 16px 18px;border-radius:3px;box-shadow:0 8px 18px rgba(0,0,0,.3);font-size:15px;line-height:1.6;margin:12px 4px;font-weight:500}
.idc{background:linear-gradient(135deg,#0b3b82,#2563eb);color:#fff;border-radius:14px;padding:14px 16px;margin:16px 4px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.idc .pf{width:58px;height:72px;border-radius:8px;background:#c7dbff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.idc div{font-size:13px;line-height:1.65}
.idc b{font-size:15px}
.doorp{position:relative;margin:16px 4px;border-radius:14px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.doorp>img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 85%;display:block}
.doorp .pl2{position:absolute;left:55%;top:33%;width:31%;background:#f8fafc;border:1.5px solid #94a3b8;border-radius:3px;text-align:center;padding:5px 0;color:#111;font-weight:800;font-size:19px;letter-spacing:1px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.doorp .pl2 small{display:block;font-size:9px;font-weight:600;color:#64748b;letter-spacing:0}
.door{margin:16px auto;width:220px;background:linear-gradient(180deg,#8b5e3c,#6b4423);border-radius:6px 6px 0 0;padding:22px 0 60px;box-shadow:0 8px 18px rgba(0,0,0,.35);position:relative}
.door .pl{margin:0 auto;width:150px;background:#f8fafc;color:#111;border-radius:4px;text-align:center;padding:8px 0;font-weight:800;font-size:22px;letter-spacing:1px;border:2px solid #cbd5e1}
.door .pl small{display:block;font-size:11px;font-weight:600;color:#64748b;letter-spacing:0}
.door .kn{position:absolute;right:20px;top:110px;width:14px;height:14px;border-radius:50%;background:#e5c07b}
.gbtn{display:block;width:100%;height:54px;border-radius:16px;background:#f2f2f7;color:#000;font-size:17px;font-weight:700;text-align:center;margin-top:22px}
.gbtn.p{background:#5E5CE6;color:#fff}
.gbtn.t{background:#0d9488;color:#fff}
.gbtn.s{background:#1c1c1e;color:#f2f2f7;margin-top:10px}
.score{display:flex;gap:8px;margin:18px 0}
.score div{flex:1;background:#1c1c1e;border-radius:16px;padding:12px;text-align:center;font-size:12px;color:#8e8e93}
.score b{display:block;font-size:24px;color:#fff;font-weight:800}
.learn{background:#1c1c1e;border-radius:14px;padding:14px 16px;margin:8px 0;font-size:14.5px;line-height:1.65;color:#d1d1d6}
.learn b{color:#fff;display:block;margin-bottom:2px}
.clear{background:#fff;color:#000;border-radius:20px;padding:20px;text-align:center;margin-top:18px}
.clear .cd{font-size:34px;font-weight:900;letter-spacing:3px;color:#5E5CE6;margin:6px 0}
.adm{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;background:#1c1c1e;border-radius:12px;overflow:hidden}
.adm td,.adm th{padding:10px;border-bottom:1px solid #2c2c2e;text-align:left}
.adm th{color:#8e8e93;font-weight:600}

/* ===== v4 additions ===== */
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
.w3{background:radial-gradient(110% 70% at 80% 10%,#fde68a 0%,rgba(253,230,138,0) 55%),radial-gradient(90% 60% at 10% 50%,#f97316 0%,rgba(249,115,22,0) 60%),linear-gradient(170deg,#b45309,#7c2d12 55%,#1c1917)}
.w4{background:linear-gradient(180deg,#0f172a,#1e293b 50%,#334155)}
.pcount{text-align:center;color:#8e8e93;font-size:13px;padding:14px 0 120px}
.pseg{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;display:flex;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:3px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:6}
.pseg button{font-size:13px;font-weight:600;padding:6px 14px;border-radius:17px;color:#000;white-space:nowrap}
.pseg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.view>.tabbar{position:relative;z-index:7}
.pt .ck2{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.15);z-index:3;display:flex;align-items:center;justify-content:center}
.pt.on .ck2{background:#007AFF}
.pt.on::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.28);z-index:2}
.pt .hrt{position:absolute;left:5px;bottom:3px;color:#fff;font-size:13px;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.5)}

.hzcta .gbtn{margin-top:0;flex:1.5;height:52px;font-size:16px}.hzcta .gbtn.s{flex:1}
@media (max-width:520px){.hzcta{padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
/* v10: 톡 답장 칩 · 장면 전환 · 에필로그 */
.kqr{flex:none;background:#BACEE0;padding:6px 12px 10px;display:flex;flex-direction:column;gap:6px;border-top:.5px solid rgba(0,0,0,.06)}
.kqr small{font-size:12px;color:#4a5a70;font-weight:600;padding:2px 4px 0}
.kqr button{background:#fff;border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.4;text-align:left;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.1);animation:hzup .35s ease both}
.kqr button:active{background:#FEE500}
.fd4{position:absolute;inset:0;z-index:700;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;border-radius:inherit}
.fd4 p{color:#fff;font-size:22px;font-weight:600;letter-spacing:1px}
.epc{background:#BACEE0;border-radius:18px;padding:10px 0;margin:10px 0 16px}
.epimg{position:relative;border-radius:16px;overflow:hidden;margin:6px 0 16px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.epimg img{display:block;width:100%}
.epimg span{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:13px}
.epimg.grad b{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-size:24px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.theend{text-align:center;font-size:13px;letter-spacing:8px;color:#8e8e93;margin:34px 0 14px;font-weight:700}
/* v12: 잠금화면 알림 스택 — 알림 개수·높이와 관계없이 깔끔하게 겹치기 */
.lk-notis.stack{padding-bottom:18px}
.lk-notis.stack .ln:nth-child(n+2){position:absolute;left:0;right:0;top:0;bottom:18px;margin:0;transform-origin:50% 100%}
.lk-notis.stack .ln:nth-child(2){transform:translateY(9px) scale(.95);opacity:.92;z-index:2}
.lk-notis.stack .ln:nth-child(3){transform:translateY(18px) scale(.9);opacity:.72;z-index:1}
.lk-notis.stack .ln:nth-child(n+4){display:none}
.lk-notis.stack .ln:nth-child(n+2)>*{opacity:0}
.lk-notis .ln .t2{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.lk-notis:not(.stack) .ln .t2{-webkit-line-clamp:3}

let appTimers=[];
function clearAppTimers(){appTimers.forEach(t=>clearInterval(t));appTimers=[]}
function R(){
 hideAT();clearAppTimers();
 $$('.sh-bg,.al-bg,.atm-bg,.as-bg,.nt,.spl').forEach(e=>e.remove());
 if(MODE==='menu')return renderMenu();
 if(MODE==='admin')return renderAdmin();
 if(G.stage==='intro')return C.intro();

 showAT();

}
function wallStyle(){return G.wallImg?`background:#000 url(${G.wallImg}) center/cover`:''}
function wallCls(){return G.wall||C.wall}
function renderHome(){
 const h=$('#home');if(!h)return;
 h.className='layer home '+wallCls();h.style.cssText=wallStyle();
 h.innerHTML=SB(true)+`<div class="hcont">${C.widget()}<div class="grid">${C.grid.map(id=>appBtn(id)).join('')}</div></div>
  <button class="spot" data-act="spot">${SV.search.replace('16','13').replace('16','13')} 검색</button>
  <div class="dock">${C.dock.map(id=>appBtn(id,true)).join('')}</div><div class="hiz"><i class="hi lt"></i></div>`;
}
function appBtn(id,dock){
 const ap=C.apps[id];const b=ap.badge?ap.badge():0;const lk=!!(ap.locked&&ap.locked());
 return `<button class="ap" data-act="open" data-arg="${id}">${ICON(ap.icon,62,b,lk)}${dock?'':`<span>${ap.name}</span>`}</button>`;
}
function renderApp(keep){
 const app=$('#app');if(!app)return;
 clearAppTimers();
 if(!G.app){app.style.display='none';app.innerHTML='';return}
 const ap=C.apps[G.app];const sub=G.nav[G.nav.length-1];
 const light=ap.light?ap.light(sub):false;
 let st=0;if(keep){const sc=$('#app .scroll');st=sc?sc.scrollTop:0}
 app.style.display='flex';app.className='layer '+(light?'dk':'');
 app.style.background=ap.bg?ap.bg(sub):'';
 app.innerHTML=SB(light)+`<div class="view ${ap.cls||''}">${ap.render(sub)}</div>`+HI(light);
 if(keep){const sc=$('#app .scroll');if(sc)sc.scrollTop=st}
 ap.after&&ap.after(sub,keep);
}
const RA=()=>renderApp(true);
A.open=(id,el)=>{
 const ap=C.apps[id];if(!ap)return;
 if(ap.locked&&ap.locked()){ap.onLocked?ap.onLocked():null;return}
 G.app=id;G.nav=[];ap.onOpen&&ap.onOpen();renderApp();animOpen(el);
 C.afterOpen&&C.afterOpen(id);
};
function openDirect(id,sub){G.app=id;G.nav=sub?[sub]:[];const ap=C.apps[id];ap.onOpen&&ap.onOpen();if(sub&&ap.onPush)ap.onPush(sub);renderApp();animOpen(null);C.afterOpen&&C.afterOpen(id)}
function switchApp(id,sub){G.app=null;G.nav=[];renderHome();openDirect(id,sub)}
function animOpen(el){
 const app=$('#app');let ox='50%',oy='50%';
 const icon=el&&el.querySelector?el.querySelector('.ico'):null;
 if(icon){const pr=phone.getBoundingClientRect(),r=icon.getBoundingClientRect();ox=((r.left+r.width/2-pr.left)/S)+'px';oy=((r.top+r.height/2-pr.top)/S)+'px'}
 G.origin=[ox,oy];app.style.transformOrigin=`${ox} ${oy}`;
 app.animate([{transform:'scale(.15)',opacity:0,borderRadius:'40px'},{transform:'scale(1)',opacity:1,borderRadius:'0px'}],{duration:430,easing:'cubic-bezier(.18,.95,.25,1)'});
}
A.goHome=()=>{
 if(!G||!G.app)return;const app=$('#app');const [ox,oy]=G.origin||['50%','50%'];
 const ap=C.apps[G.app];ap.leave&&ap.leave();
 app.style.transformOrigin=`${ox} ${oy}`;clearAppTimers();
 const a=app.animate([{transform:'scale(1)',opacity:1,borderRadius:'48px'},{transform:'scale(.15)',opacity:0,borderRadius:'60px'}],{duration:330,easing:'cubic-bezier(.4,0,.7,1)'});
 a.onfinish=()=>{G.app=null;G.nav=[];renderApp();renderHome();C.save&&C.save()};
};
A.push=k=>{G.nav.push(k);const ap=C.apps[G.app];ap.onPush&&ap.onPush(k);renderApp();const v=$('#app .view');v&&v.animate([{transform:'translateX(100%)'},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.9,.3,1)'})};
A.pop=()=>{if(!G.nav.length)return A.goHome();const ap=C.apps[G.app];ap.leave&&ap.leave(G.nav[G.nav.length-1]);G.nav.pop();renderApp();const v=$('#app .view');v&&v.animate([{transform:'translateX(-25%)',opacity:.7},{transform:'none',opacity:1}],{duration:330,easing:'cubic-bezier(.2,.9,.3,1)'})};

function phState(){return G.ph||(G.ph={tab:0,view:'all',sel:false,picked:[],fav:{},edit:{},dark:false,ctx:[],cur:[],q:'',jump:true})}
function photosApp(o){ // o:{list:()=>[], mems:[], albums:[{id,n,tag}], chips:[], onView:k=>{}}
 const L=()=>o.list();const find=k=>L().find(p=>p.k===k);

 const grid=(list,sel)=>{const st=phState();return `<div class="pgrid">${list.map(p=>`<div class="pt ${st.picked.includes(p.k)?'on':''}" data-act="${sel?'phPick':'phOpen'}" data-arg="${p.k}">${photoArt(p)}${st.fav[p.k]&&!sel?`<span class="hrt">${GL('heartF',14)}</span>`:''}${sel?`<i class="ck2">${st.picked.includes(p.k)?SV.check:''}</i>`:''}</div>`).join('')}</div>`};

 o.results=q=>{const st=phState();q=(q||'').trim();

    <div class="psec">유틸리티</div><div>${[['download','가져온 항목','nope'],['eyeslash','가려진 항목','phLocked',1],['trash','최근 삭제된 항목','phLocked',1]].map(r=>`<button class="lrow" data-act="${r[2]}" data-arg="가져온 항목이 없어요"><span class="ic">${GL(r[0],24)}</span>${r[1]}<span class="c">${r[3]?GL('lock',15,'#8e8e93'):''}${SV.chevR}</span></button>`).join('')}</div>
    <div style="height:110px"></div></div>${tabs(2)}`},
  sr(){const st=phState();
   return `<div class="nb"><span></span><div class="tt"></div><div class="rt"></div></div><div class="lt">검색</div>
   <div class="srch">${SV.search}<input id="phq" placeholder="장소, 사물, 날짜 등" value="${esc(st.q)}" autocomplete="off"></div>

 };
 o.find=find;
 return {name:'사진',icon:'photo',o,

function photoView(p){
 const st=phState();const fav=st.fav[p.k];const flt=st.edit[p.k]||'none';const [dt,tm]=p.d.split(/ (?=오)/);

function calApp(o){ // o:{ev:{'m-d' 또는 'YYYY-m-d':[...]}, today:[m,d], year, onEvent:e=>{}}
 const Y0=o.year||2026;
 const pk=k=>{const p=k.split('-').map(Number);return p.length===3?p:[Y0,p[0],p[1]]};
 const all=()=>Object.entries(o.ev).flatMap(([d,l])=>l.map(e=>[pk(d),e]));
 const at=(y,m,d)=>all().filter(([k])=>k[0]===y&&k[1]===m&&k[2]===d).map(x=>x[1]);
 const find=k=>all().find(x=>x[1].k===k);
 const isToday=(y,m,d)=>y===Y0&&m===o.today[0]&&d===o.today[1];
 o.find=find;
 o.list=q=>{const l=all().filter(([d,e])=>!q||(e.t+(e.memo||'')).includes(q)).sort((a,b)=>a[0][0]-b[0][0]||a[0][1]-b[0][1]||a[0][2]-b[0][2]);
  return l.length?l.map(([d,e])=>`<button class="cev" data-act="calGo" data-arg="${e.k}"><i style="background:${e.c}"></i><b>${e.t}<br><small style="color:#8e8e93;font-weight:400;font-size:13px">${d[0]}년 ${d[1]}월 ${d[2]}일</small></b><span>${e.w}</span></button>`).join(''):'<div class="empty">결과 없음</div>'};
 return {name:'캘린더',icon:'cal',cls:'cal',o,
  onOpen:()=>{if(G.calM==null){G.calM=o.today[0];G.calD=o.today[1]}if(G.calY==null)G.calY=Y0},
  render:s=>{const Y=G.calY||Y0;
   if(s==='year')return `${NB({back:'',title:'',right:''}).replace('<span></span>','')}<div class="cm" style="font-size:34px"><span>${Y}년</span><span class="ar"><button data-act="calYr" data-arg="-1">${SV.chev}</button><button data-act="calYr" data-arg="1" style="transform:scaleX(-1)">${SV.chev}</button></span></div><div class="scroll"><div class="ygrid">${[...Array(12)].map((_,i)=>{const m=i+1,f=new Date(Y,i,1).getDay(),n=new Date(Y,m,0).getDate();return `<button class="ymo" data-act="calPick" data-arg="${m}"><b>${m}월</b><div class="d">${'<i></i>'.repeat(f)}${[...Array(n)].map((_,d)=>`<i class="${isToday(Y,m,d+1)?'td':''}">${d+1}</i>`).join('')}</div></button>`}).join('')}</div></div>`;
   if(s==='csearch')return `${NB({back:G.calM+'월'})}<div class="srch" style="margin-top:4px">${SV.search}<input id="calq" placeholder="이벤트 검색" autocomplete="off"></div><div class="scroll" id="calres">${o.list('')}</div>`;
   if(s&&s.startsWith('ev:')){const [d,e]=find(s.slice(3));const [yy,m,dd]=d;o.onEvent&&o.onEvent(e);
    return `${NB({back:m+'월',right:'<button data-act="nope" data-arg="다른 사람의 일정은 편집할 수 없어요" style="color:#FF3B30">편집</button>'})}<div class="scroll" style="background:#F2F2F7"><div class="ced" style="background:#fff;padding:14px 16px 18px;margin-bottom:22px"><h2>${e.t}</h2><div class="w" style="margin:0">${yy}년 ${m}월 ${dd}일 ${wday(yy,m,dd)}<br>${e.w}</div></div>
    <div class="grp"><div class="opt" style="justify-content:space-between"><span>캘린더</span><span style="color:#8e8e93">● ${e.cal||'개인'}</span></div><div class="opt" style="justify-content:space-between"><span>알림</span><span style="color:#8e8e93">하루 전 (오전 9시)</span></div></div>
    ${e.memo?`<div class="grp"><div style="padding:12px 16px;font-size:16px;line-height:1.5"><div style="font-size:13px;color:#8e8e93;margin-bottom:4px">메모</div>${e.memo}</div></div>`:''}
    <div class="grp"><button class="opt" data-act="nope" data-arg="다른 사람의 일정은 삭제할 수 없어요" style="color:#FF3B30;justify-content:center">이벤트 삭제</button></div></div>`}
   const m=G.calM,y=Y,first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
   let cells='';for(let i=0;i<first;i++)cells+='<div class="cday e0"></div>';
   for(let d=1;d<=days;d++){const wd=(first+d-1)%7;const has=at(y,m,d).length;const td=isToday(y,m,d);
    cells+=`<div class="cday ${wd===0||wd===6?'wk':''} ${td?'td':''} ${d===G.calD?'sel':''} ${has?'':'e0'}" data-act="calD" data-arg="${d}"><span>${d}</span><i></i></div>`}
   const evs=at(y,m,G.calD);
   return `<div class="nb"><button class="bk" data-act="push" data-arg="year">${SV.chev}<span>${y}년</span></button><div class="tt"></div><div class="rt"><button data-act="push" data-arg="csearch">${SV.search}</button><button data-act="calAdd">${SV.plus}</button></div></div>
   <div class="cm"><span>${m}월</span><span class="ar"><button data-act="calM" data-arg="-1">${SV.chev}</button><button data-act="calM" data-arg="1" style="transform:scaleX(-1)">${SV.chev}</button></span></div>
   <div class="cw7">${['일','월','화','수','목','금','토'].map(x=>`<div>${x}</div>`).join('')}</div>
   <div class="cgrid">${cells}</div>
   <div class="scroll clist">${evs.length?evs.map(e=>`<button class="cev" data-act="push" data-arg="ev:${e.k}"><i style="background:${e.c}"></i><b>${e.t}</b><span>${e.w}</span>${SV.chevR}</button>`).join(''):'<div class="empty">이벤트 없음</div>'}</div>
   <div class="toolbar" style="height:70px;align-items:center;padding-top:0"><button data-act="calToday" style="color:#FF3B30;font-size:17px">오늘</button><button data-act="calList" style="color:#FF3B30;font-size:17px">캘린더</button><button data-act="alertMsg" data-arg="받은 초대 없음|새로운 이벤트 초대가 없습니다." style="color:#FF3B30;font-size:17px">받은 편지함</button></div>`},
  after:s=>{const q=$('#calq');if(q){q.focus();q.addEventListener('input',()=>{$('#calres').innerHTML=C.apps.cal.o.list(q.value.trim())})}}};
}
A.calM=d=>{let m=G.calM+(+d),y=G.calY||C.apps.cal.o.year||2026;if(m<1){m=12;y--}if(m>12){m=1;y++}G.calM=m;G.calY=y;G.calD=1;renderApp()};

A.calAdd=()=>sheet(`<div class="cmp"><div class="sht"><button data-act="closeSheet">취소</button><b>새로운 이벤트</b><button data-act="calAddDone" style="font-weight:600">추가</button></div><div class="grp"><div class="fld"><input placeholder="제목"></div><div class="fld"><input placeholder="위치 또는 영상 통화"></div></div><div class="grp"><div class="opt" style="justify-content:space-between"><span>하루 종일</span>${SW(false,'noop')}</div><div class="opt" style="justify-content:space-between"><span>시작</span><span style="color:#8e8e93">11월 19일 오후 3:00</span></div></div></div>`);

/* =================== 시계 =================== */
function clockApp(){
 const CT=[[SV.globeT,'세계 시계'],[SV.alarmT,'알람'],[SV.swT,'스톱워치'],[SV.timerT,'타이머']];
 const fmt=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(c).padStart(2,'0')}`};
 const swNow=()=>{const w=G.sw||{acc:0,run:null,laps:[]};return w.acc+(w.run?Date.now()-w.run:0)};
 const tmLeft=()=>{const t=G.tm;if(!t)return 0;return Math.max(0,t.end-Date.now())};
 const city=(n,off,lbl)=>{const d=new Date(Date.now()+off*3600000);return `<div class="ckr"><div><small>${lbl}</small><b>${n}</b></div><span class="t">${(d.getHours()%12||12)}:${String(d.getMinutes()).padStart(2,'0')}<small style="display:inline;font-size:20px">${d.getHours()<12?'오전':'오후'}</small></span></div>`};
 return {name:'시계',icon:'clock',cls:'clkapp',
  onOpen:()=>{if(G.ckT==null)G.ckT=0;G.al=G.al||[true,false,true]},
  render:()=>{const t=G.ckT;let body='';
   if(t===0)body=`${NB({back:null,right:SV.plus})}<div class="lt">세계 시계</div><div class="scroll">${city('서울',0,'오늘, +0시간')}${city('뉴욕',-14,'어제, -14시간')}${city('런던',-9,'오늘, -9시간')}${city('파리',-8,'오늘, -8시간')}${city('시드니',2,'오늘, +2시간')}</div>`;
   if(t===1)body=`${NB({back:null,right:SV.plus})}<div class="lt">알람</div><div class="scroll">${[['6:30','오전','1교시 🥲'],['7:40','오전','셔틀 타기'],['10:00','오후','과제 확인 📚']].map((a,i)=>`<div class="ckr" style="align-items:center"><div style="opacity:${G.al[i]?1:.45}"><span class="t">${a[0]}<small style="display:inline;font-size:20px">${a[1]}</small></span><small>${a[2]}</small></div>${SW(G.al[i],'alTog',i)}</div>`).join('')}</div>`;
   if(t===2){const w=G.sw||{};body=`<div class="swd" id="swd">${fmt(swNow())}</div><div class="swb"><button class="g1" data-act="swLap">${w.run?'랩':'재설정'}</button><button class="${w.run?'g3':'g2'}" data-act="swGo">${w.run?'중단':'시작'}</button></div><div class="scroll">${(w.laps||[]).map((l,i)=>`<div class="ckr"><span>랩 ${(w.laps.length-i)}</span><span style="font-feature-settings:'tnum'">${fmt(l)}</span></div>`).join('')}</div>`}
   if(t===3){const left=tmLeft();body=G.tm?`<div class="swd" id="tmd">${fmt(left).slice(0,5)}</div><div class="swb"><button class="g1" data-act="tmCancel">취소</button><button class="g3" data-act="tmCancel">완료</button></div>`:`<div class="lt" style="padding-top:20px">타이머</div><div class="shopg" style="grid-template-columns:1fr 1fr 1fr">${[1,3,5,10,15,30].map(m=>`<button data-act="tmGo" data-arg="${m}" style="text-align:center;font-size:20px;font-weight:600;border-radius:50%;aspect-ratio:1;background:#e5e5ea">${m}분</button>`).join('')}</div>`}
   return body+(t===3?`<div style="flex:1"></div>`:'')+TABS(CT,t,'ckTab')},
  after:()=>{appTimers.push(setInterval(()=>{const a=$('#swd');if(a)a.textContent=fmt(swNow());const b=$('#tmd');if(b){const l=tmLeft();b.textContent=fmt(l).slice(0,5);if(l<=0&&G.tm){G.tm=null;vib([200,100,200]);alertIOS('⏰ 타이머','타이머가 끝났어요!');RA()}}},47))}};
}
A.ckTab=i=>{G.ckT=+i;renderApp()};
A.alTog=i=>{G.al[+i]=!G.al[+i];RA()};
A.swGo=()=>{const w=G.sw=G.sw||{acc:0,run:null,laps:[]};if(w.run){w.acc+=Date.now()-w.run;w.run=null}else w.run=Date.now();RA()};
A.swLap=()=>{const w=G.sw=G.sw||{acc:0,run:null,laps:[]};if(w.run){w.laps.unshift(w.acc+Date.now()-w.run)}else{G.sw={acc:0,run:null,laps:[]}}RA()};
A.tmGo=m=>{G.tm={end:Date.now()+(+m)*60000};RA()};
A.tmCancel=()=>{G.tm=null;RA()};
